name: Keep BrainBloom warm

# Pings /healthz around the clock so the Render free instance does not deliberately
# sleep overnight. A continuously running instance uses up to 744 of the free
# plan's shared 750 instance-hours/month; other services share that allowance.
#
# Notes: GitHub cron is UTC-only and best-effort: runs can be delayed or skipped,
# so use an external scheduler when dependable timing is needed. On a public
# repo, Actions minutes are free/unlimited. GitHub auto-disables scheduled
# workflows after 60 days with no repo activity; re-enable from the Actions tab
# if that ever happens.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}            # manual "warm it up now" button

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions: {}                    # outbound health checks only; no repo access needed

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Hit /healthz
        shell: python
        run: |
          import json
          import subprocess
          import time

          URL = "https://brainbloom-workshop.onrender.com/healthz"
          BUDGET = 420
          MAX_BODY = 4096

          def probe(timeout):
              # curl's total timeout bounds DNS, connection and body reads together.
              # The process timeout also keeps every attempt within the remaining budget.
              # A Render loading page may be large and is never application readiness.
              try:
                  result = subprocess.run(
                      ["curl", "--silent", "--show-error", "--write-out", "\n%{http_code}",
                       "--header", "Accept: application/json", "--connect-timeout",
                       str(min(15, timeout)), "--max-time", str(timeout),
                       "--max-filesize", str(MAX_BODY), URL],
                      capture_output=True, timeout=timeout, check=False,
                  )
              except subprocess.TimeoutExpired:
                  return False, f"request timed out after {timeout:.1f}s"
              except OSError as exc:
                  return False, f"could not run curl: {exc}"
              body, _, status = result.stdout.rpartition(b"\n")
              detail = (f"HTTP {status.decode('ascii', errors='replace') or '000'}, "
                        f"curl exit {result.returncode}, body {len(body)} bytes")
              if result.returncode != 0 or status != b"200" or len(body) > MAX_BODY:
                  return False, detail
              try:
                  healthy = json.loads(body) == {"status": "ok"}
              except (ValueError, UnicodeDecodeError):
                  return False, detail + ", invalid health JSON"
              return healthy, detail + ("" if healthy else ", unexpected health JSON")

          def warm():
              started = time.monotonic()
              deadline = started + BUDGET
              attempt = 0
              # Use elapsed time, not a fixed attempt count: quick upstream failures
              # must not exhaust retries before the application has time to start.
              while (remaining := deadline - time.monotonic()) > 0:
                  attempt += 1
                  healthy, detail = probe(min(100, remaining))
                  elapsed = time.monotonic() - started
                  print(f"attempt {attempt} at {elapsed:.1f}s -> {detail}", flush=True)
                  if healthy:
                      print("warm (application health confirmed)", flush=True)
                      return 0
                  remaining = deadline - time.monotonic()
                  if remaining > 0:
                      time.sleep(min(10, remaining))
              print(f"::error::keepalive could not confirm healthy application JSON from {URL} "
                    f"after {attempt} attempts over {time.monotonic() - started:.1f}s", flush=True)
              return 1

          if __name__ == "__main__":
              raise SystemExit(warm())
