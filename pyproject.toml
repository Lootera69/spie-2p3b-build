[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spie"
version = "0.1.0"
description = "Symbolic Puzzle Invention Engine — formal puzzle representation, proof, and certification."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "z3-solver==4.13.4",
    "clingo==5.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "hypothesis==6.122.3",
]

[project.scripts]
spie = "spie.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
